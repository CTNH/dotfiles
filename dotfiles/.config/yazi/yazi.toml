[plugin]
prepend_previewers = [
  { url = "*.md", run = "glow" },
]
prepend_fetchers = [
	# { id = "git", name = "*/", run = "git" },
	# { id = "git", name = "*", run = "git" },
]

[mgr]
linemode = "size"
# linemode = "size_and_mtime"
sort_by = "natural"

[opener]
edit = [
	{ run = '${EDITOR:-vi} %s', desc = "$EDITOR", block = true, for = "unix" },
	{ run = 'nvim %s',    block = true,  desc = "Neovim",         for = "windows" },
	{ run = 'code %s',    orphan = true, desc = "code",           for = "windows" },
]
open = [
	{ run = 'xdg-open %s1',                desc = "Open", for = "linux" },
	{ run = 'open %s',                    desc = "Open", for = "macos" },
	{ run = 'start "" %s',   orphan = true, desc = "Open", for = "windows" },
]
reveal = [
	{ run = 'xdg-open "$(dirname %s1)"',           desc = "Reveal", for = "linux" },
	{ run = 'open -R %s1',                         desc = "Reveal", for = "macos" },
	{ run = 'explorer /select,%s1',  orphan = true, desc = "Reveal", for = "windows" },
	{ run = '''exiftool %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = 'for file in %s; do unzip -d "${file%.*}" "$file"; done', desc = "Extract here", for = "unix" },
	# { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
	{ run = '7zFM %s',     orphan = true, desc = "7zFM",         for = "windows" },
	{ run = 'ya pub extract --list %s',   desc = "Extract here", for = "windows" },
]
play = [
	{ run = 'mpv --force-window %s', orphan = true, for = "unix" },
	{ run = 'mpv --force-window %s', orphan = true, for = "windows" },
	{ run = '''mediainfo %s1; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

imgs = [
	{ run = '~/bin/rifle_sxiv.sh -- %s', orphan = true, desc = "sxiv", for = "unix" },
]
# Archives
archives = [
	{ run = 'tar vvtf %s1 | $PAGER', block = true, desc = "Preview", for = "unix" },
	{ run = 'for file in %s; do tar vvxf "$file"; done', desc = "Extract here", for = "unix" },
]
archive_zip = [
	{ run = 'unzip -l %s1 | less', block = true, desc = "Preview", for = "unix" },
	{ run = 'for file in %s; do unzip -d "${file%.*}" "$file"; done', desc = "Extract here", for = "unix" },
]
archive_rar = [
	{ run = 'unrar l %s1 | less', block = true, desc = "Preview", for = "unix" },
	{ run = 'for file in %s; do unrar x "$file"; done', desc = "Extract here", for = "unix" },
]

[open]
rules = [
	# Scripts
	{ url = "*.bat", use = [ "edit", "open", "reveal" ] },
	{ url = "*.sln", use = [ "open", "edit", "reveal" ] },

	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "imgs", "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Archive
	{ mime = "application/zip", 	use = [ "archive_zip", "reveal" ] },
	{ mime = "application/{vnd.rar,x-rar,rar}", use = [ "archive_rar", "reveal" ] },
	{ mime = "application/gzip", 	use = [ "archives", "reveal" ] },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz}", use = [ "archives", "reveal" ] },
	# JSON
	{ mime = "application/{json,x-ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/x-empty", use = [ "edit", "reveal" ] },
	# Fallback
	{ mime = "*", use = [ "open", "reveal" ] },
]

